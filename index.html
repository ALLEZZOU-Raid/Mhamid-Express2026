<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test ALLEZZOU RAID</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Roboto', sans-serif; background: #fdf6e3; color: #1c1c1c; }
    h1,h2 { font-family: 'Oswald', sans-serif; text-transform: uppercase; }

    /* Navbar fixe, hauteur stable */
    .navbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: 60px; display: flex; align-items: center;
      background: rgba(0,0,0,0.6); color: #fff; z-index: 1000;
      padding: 0 20px;
    }

    /* Hero plein écran moins la navbar */
    .hero {
      margin-top: 60px;              /* évite le recouvrement */
      height: calc(100vh - 60px);    /* équilibre la hauteur */
      background: #000; overflow: hidden; position: relative;
    }
    .hero-img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
    .hero-gradient { position: absolute; left:0; right:0; bottom:0; height: 40%;
      background: linear-gradient(to top, rgba(0,0,0,0.6), transparent); }

    /* Contenu normal sous le hero */
    section { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    .test { background: #fff; border: 2px solid #e63946; }
  </style>
</head>
<body>

  <nav class="navbar">
    <strong>ALLEZZOU RAID</strong>
  </nav>

  <section class="hero">
    <img class="hero-img" src="https://i.imgur.com/GzzBPnZ.png" alt="Banner">
    <div class="hero-gradient"></div>
  </section>

  <section class="test">
    <h2>Test contenu</h2>
    <p>Si tu lis ce texte, le scroll et l’affichage sous la bannière fonctionnent.</p>
  </section>

</body>
</html>
