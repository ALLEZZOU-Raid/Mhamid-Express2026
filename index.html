<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ALLEZZOU RAID</title>

  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #fdf6e3;
      color: #1c1c1c;
    }

    /* ------------------------------
       NAVBAR
    ------------------------------ */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 15px 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      color: white;
      z-index: 1000;
    }

    .navbar-container {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .nav-logo {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 25px;
      margin: 0;
      padding: 0;
      transition: transform 0.3s ease-in-out;
    }

    .nav-links a {
      color: white;
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #ff7f11;
    }

    /* Bouton hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }

    .hamburger span {
      width: 25px;
      height: 3px;
      background: white;
      transition: 0.3s;
    }

    /* ------------------------------
       RESPONSIVE
    ------------------------------ */
    @media (max-width: 768px) {
      .nav-links {
        position: absolute;
        top: 60px;
        right: 0;
        background: rgba(0,0,0,0.9);
        flex-direction: column;
        width: 220px;
        padding: 20px;
        gap: 15px;
        transform: translateX(100%); /* caché par défaut */
      }

      .nav-links.active {
        transform: translateX(0); /* slide-in */
      }

      .hamburger {
        display: flex; /* visible sur mobile */
      }
    }

    /* Animation hamburger en croix */
    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(6px, -6px);
    }

    /* ------------------------------
       HERO
    ------------------------------ */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: black;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hero-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    }

    /* ------------------------------
       INTRO
    ------------------------------ */
    .intro {
      text-align: center;
      padding: 80px 20px;
      background: #fff;
      border-bottom: 3px solid #e63946;
    }

    .intro h1 {
      font-size: 3.2rem;
      margin-bottom: 15px;
    }

    .intro p {
      font-size: 1.4rem;
      color: #444;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #e63946;
      color: white;
      font-weight: bold;
      border-radius: 5px;
      transition: 0.3s;
      font-family: 'Oswald', sans-serif;
    }

    .btn:hover {
      background: black;
    }

    /* ------------------------------
       SECTIONS
    ------------------------------ */
    section {
      padding: 60px 20px;
      max-width: 1100px;
      margin: auto;
    }

    section h2 {
      color: #e63946;
      margin-bottom: 20px;
    }

    /* ------------------------------
       BLOG
    ------------------------------ */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
    }

    .blog-post {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .blog-post h3 {
      margin-top: 0;
      color: #e63946;
    }
