<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ALLEZZOU RAID</title>

  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #fdf6e3;
      color: #1c1c1c;
    }

    /* ------------------------------
       NAVBAR
    ------------------------------ */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 15px 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      color: white;
      z-index: 1000;
    }

    .navbar-container {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    .nav-logo {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 25px;
      margin: 0;
      padding: 0;
      transition: transform 0.3s ease-in-out;
    }

    .nav-links a {
      color: white;
      font-family: 'Oswald', sans-serif;
      font-size: 1rem;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #ff7f11;
    }

    /* Bouton hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
    }

    .hamburger span {
      width: 25px;
      height: 3px;
      background: white;
      transition: 0.3s;
    }

    /* ------------------------------
       RESPONSIVE
    ------------------------------ */
    @media (max-width: 768px) {
      .nav-links {
        position: absolute;
        top: 60px;
        right: 0;
        background: rgba(0,0,0,0.9);
        flex-direction: column;
        width: 220px;
        padding: 20px;
        gap: 15px;
        transform: translateX(100%); /* caché par défaut */
      }

      .nav-links.active {
        transform: translateX(0); /* slide-in */
      }

      .hamburger {
        display: flex; /* visible sur mobile */
      }
    }

    /* Animation hamburger en croix */
    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(6px, -6px);
    }

    /* ------------------------------
       HERO
    ------------------------------ */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: black;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hero-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%;
      background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
    }
  </style>
</head>

<body>

<!-- ✅ NAVBAR -->
<nav class="navbar">
  <div class="navbar-container">
    <div class="nav-logo">ALLEZZOU RAID</div>
    <ul class="nav-links">
      <li><a href="#about">À propos</a></li>
      <li><a href="#gallery">Galerie</a></li>
      <li><a href="#team">Équipe</a></li>
      <li><a href="#partners">Partenaires</a></li>
      <li><a href="#register">Inscriptions</a></li>
    </ul>
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</nav>

<!-- ✅ HERO -->
<section class="hero">
  <img src="https://i.imgur.com/GzzBPnZ.png" class="hero-img">
  <div class="hero-gradient"></div>
</section>

<script>
  // ✅ Script pour ouvrir/fermer le menu
  const hamburger = document.getElementById('hamburger');
  const navLinks = document.querySelector('.nav-links');

  hamburger.addEventListener('click', () => {
    navLinks.classList.toggle('active');
    hamburger.classList.toggle('active');
  });
</script>

</body>
</html>
